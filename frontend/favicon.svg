<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#16171e" />
  <rect x="4" y="4" width="56" height="56" rx="10" fill="#22242f" stroke="#3c404f" stroke-width="2" />
  <!-- Маховик задвижки / Энергоцех -->
  <ellipse cx="32" cy="16" rx="16" ry="5" fill="none" stroke="#60a5fa" stroke-width="3.5" />
  <line x1="32" y1="16" x2="32" y2="28" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" />
  <!-- Корпус задвижки -->
  <polygon points="14,28 32,42 14,54" fill="url(#grad)" stroke="#93c5fd" stroke-width="1.5" />
  <polygon points="50,28 32,42 50,54" fill="url(#grad)" stroke="#93c5fd" stroke-width="1.5" />
  <!-- Центральный индикатор -->
  <circle cx="32" cy="41" r="4.5" fill="#22c55e" stroke="#ffffff" stroke-width="1.5" />
</svg>
