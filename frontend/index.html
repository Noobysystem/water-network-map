<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивная схема питьевого водопровода</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; display: flex; font-family: system-ui, sans-serif; }
        #sidebar { width: 320px; height: 100vh; background: #1e1e24; color: #fff; padding: 15px; display: flex; flex-direction: column; gap: 12px; z-index: 1000; flex-shrink: 0; }
        #map { width: calc(100vw - 320px); height: 100vh; background: #2b2b36; }
        .mode-selector { display: flex; flex-direction: column; gap: 8px; background: #2b2b36; padding: 10px; border-radius: 6px; }
        .mode-selector label { cursor: pointer; }
        #inspector { background: #2b2b36; padding: 10px; border-radius: 6px; flex-grow: 1; overflow-y: auto; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>Водопроводная сеть</h2>
        <div class="mode-selector">
            <label><input type="radio" name="mode" value="view" checked> Просмотр</label>
            <label><input type="radio" name="mode" value="add_node"> + Колодец / Узел</label>
            <label><input type="radio" name="mode" value="add_hydrant"> + Гидрант (ПГ)</label>
            <label><input type="radio" name="mode" value="add_pipe"> + Участок трубы</label>
        </div>
        <hr>
        <div id="inspector">
            <p>Выберите объект на схеме для просмотра свойств.</p>
        </div>
        <div id="stats">
            <p>Колодцев: <b id="count-nodes">0</b></p>
            <p>Трубопроводов: <b id="count-pipes">0</b></p>
        </div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
