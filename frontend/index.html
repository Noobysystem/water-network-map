<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивная схема запорной арматуры и гидрантов</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; display: flex; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        #sidebar { width: 360px; height: 100vh; background: #16171d; color: #f0f0f5; padding: 16px; display: flex; flex-direction: column; gap: 12px; z-index: 1000; flex-shrink: 0; box-shadow: 2px 0 14px rgba(0,0,0,0.6); }
        #map { width: calc(100vw - 360px); height: 100vh; background: #1f2027; }
        .panel-box { background: #232530; padding: 12px; border-radius: 8px; display: flex; flex-direction: column; gap: 8px; border: 1px solid #2e303d; }
        .mode-selector label { cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 13.5px; padding: 4px 0; }
        #inspector { background: #232530; padding: 14px; border-radius: 8px; flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; border: 1px solid #2e303d; }
        .input-group { display: flex; flex-direction: column; gap: 4px; }
        .input-group label { font-size: 11px; color: #9aa0a6; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
        .input-group input, .input-group select, .input-group textarea { background: #16171d; border: 1px solid #3c404b; color: #fff; padding: 8px 10px; border-radius: 6px; font-size: 13px; outline: none; font-family: inherit; }
        .input-group textarea { resize: vertical; min-height: 65px; line-height: 1.4; }
        .input-group input:focus, .input-group select:focus, .input-group textarea:focus { border-color: #3b82f6; }
        .btn-group { display: flex; gap: 8px; margin-top: 6px; }
        button { padding: 9px 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; font-size: 13px; transition: 0.15s; }
        .btn-primary { background: #3b82f6; color: #fff; flex-grow: 1; }
        .btn-primary:hover { background: #2563eb; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-danger:hover { background: #dc2626; }
        #stats { font-size: 12.5px; color: #9aa0a6; border-top: 1px solid #2e303d; padding-top: 8px; display: flex; flex-direction: column; gap: 4px; }
        .stat-row { display: flex; justify-content: space-between; }
        .custom-label { font-size: 11px; font-weight: bold; background: rgba(18,19,25,0.9); color: #00f0ff; border: 1px solid #00f0ff; border-radius: 4px; padding: 1px 5px; }
        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #c5c7d0; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2 style="margin: 0; font-size: 18px; color: #fff;">Запорная арматура и ПГ</h2>
        
        <div class="panel-box mode-selector">
            <label><input type="radio" name="mode" value="view" checked> 🔍 Просмотр / Выбор объекта</label>
            <label><input type="radio" name="mode" value="add_valve"> 🛑 + Добавить задвижку</label>
            <label><input type="radio" name="mode" value="add_hydrant"> 🔴 + Добавить гидрант (ПГ)</label>
        </div>

        <div class="panel-box" style="padding: 10px 12px;">
            <label style="font-size: 12.5px; cursor: pointer; display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
                <input type="checkbox" id="toggle-labels" checked onchange="toggleLabels()"> Показывать номера на схеме
            </label>
            <div style="font-size: 11px; color: #8e929b; text-transform: uppercase; font-weight: 700; margin-top: 4px;">Статусы арматуры:</div>
            <div style="display: grid; grid-template-columns: 1fr; gap: 3px; margin-top: 4px;">
                <div class="legend-item"><span class="dot" style="background:#52c41a;"></span> В работе (Открыта)</div>
                <div class="legend-item"><span class="dot" style="background:#fa8c16;"></span> Закрыта (Отсечена)</div>
                <div class="legend-item"><span class="dot" style="background:#ff4d4f; border: 2px solid #fff;"></span> Нет щёк / Не перекрыть!</div>
                <div class="legend-item"><span class="dot" style="background:#faad14;"></span> Плохо закрывается / Дефект</div>
            </div>
        </div>

        <div id="inspector">
            <p style="color: #9aa0a6; margin: 0;">Кликните по любой задвижке или гидранту на схеме для редактирования статуса и описания.</p>
        </div>

        <div id="stats">
            <div class="stat-row"><span>Всего объектов:</span> <b id="count-total" style="color:#fff;">0</b></div>
            <div class="stat-row"><span>С дефектами/без щёк:</span> <b id="count-defects" style="color:#ff7875;">0</b></div>
        </div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
